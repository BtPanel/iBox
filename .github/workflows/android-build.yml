name: Android Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  debug:
    name: Test and build Debug APKs
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MEDIA3_REPOSITORY_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary build configuration
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore ci-debug.jks \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=ci-debug.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            :app:testLeanbackArm64_v8aDebugUnitTest \
            :app:testLeanbackArmeabi_v7aDebugUnitTest \
            :app:testMobileArm64_v8aDebugUnitTest \
            :app:testMobileArmeabi_v7aDebugUnitTest \
            -PchaquopyBuildPython="$(command -v python)" \
            --stacktrace

      - name: Run mobile and TV lint
        shell: bash
        run: |
          ./gradlew \
            :app:lintMobileArm64_v8aDebug \
            :app:lintLeanbackArm64_v8aDebug \
            -PchaquopyBuildPython="$(command -v python)" \
            --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 14

      - name: Compile mobile and TV UI tests
        shell: bash
        run: |
          ./gradlew \
            :app:assembleMobileArm64_v8aDebugAndroidTest \
            :app:assembleLeanbackArm64_v8aDebugAndroidTest \
            -PchaquopyBuildPython="$(command -v python)" \
            --stacktrace

      - name: Build Debug APKs
        shell: bash
        run: |
          ./gradlew :app:assembleDebug \
            -PchaquopyBuildPython="$(command -v python)" \
            --stacktrace

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build signed Release APKs
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MEDIA3_REPOSITORY_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create release signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing one or more Android signing secrets." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ci-release.jks
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=ci-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Release APKs
        shell: bash
        run: |
          ./gradlew :app:assembleRelease \
            -PchaquopyBuildPython="$(command -v python)" \
            --stacktrace

      - name: Collect APKs and checksums
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -path '*/release/*.apk' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -name '*.apk' -print -quit)"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
