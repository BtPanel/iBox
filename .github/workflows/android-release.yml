name: Build Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Validate build secrets
        shell: bash
        env:
          MEDIA3_REPOSITORY_TOKEN: ${{ secrets.MEDIA3_REPOSITORY_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$MEDIA3_REPOSITORY_TOKEN" ]] || missing+=(MEDIA3_REPOSITORY_TOKEN)
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Configure these repository secrets before building Release APKs: ${missing[*]}"
            exit 1
          fi

      - name: Check out project and Media3
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MEDIA3_REPOSITORY_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create release signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ci-release.jks
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=ci-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Release APKs
        shell: bash
        run: |
          ./gradlew cleanRelease :app:assembleRelease \
            -PchaquopyBuildPython="$(command -v python)" \
            --stacktrace

      - name: Collect APKs and checksums
        shell: bash
        run: |
          mkdir -p dist
          cp Release/apk/*.apk dist/
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: iBox-release-apks-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
